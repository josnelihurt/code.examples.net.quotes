---
openapi: 3.1.1
info:
  title: Auth.Api | v1
  version: 1.0.0
servers:
- url: "/"
paths:
  "/api/auth/login":
    post:
      tags:
      - Auth
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequestDto"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponseDto"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponseDto"
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/HttpValidationProblemDetails"
  "/api/auth/validate":
    post:
      tags:
      - Auth
      operationId: ValidateToken
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: 'null'
              - "$ref": "#/components/schemas/ValidateRequestDto"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidateResponseDto"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidateResponseDto"
components:
  schemas:
    ErrorResponseDto:
      required:
      - error
      type: object
      properties:
        error:
          type: string
          description: Human-readable reason authentication failed.
      description: Error payload returned when authentication fails.
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: "^-?(?:0|[1-9]\\d*)$"
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequestDto:
      type: object
      properties:
        username:
          type: string
          description: Account username.
        password:
          type: string
          description: Account password.
      description: Credentials submitted to obtain an access token.
    LoginResponseDto:
      required:
      - accessToken
      - correlationId
      - expiresIn
      - username
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token for authenticated API calls.
        correlationId:
          type: string
          description: Correlation id for this login; clients should send it as X-Correlation-Id
            on later calls.
        expiresIn:
          pattern: "^-?(?:0|[1-9]\\d*)$"
          type:
          - integer
          - string
          description: Access token lifetime in seconds.
          format: int32
        username:
          type: string
          description: Authenticated username.
      description: Successful login result including the issued access token.
    ValidateRequestDto:
      type: object
      properties:
        accessToken:
          type:
          - 'null'
          - string
          description: Access token to validate when not supplied via Authorization
            header.
      description: Optional body for token validation; Authorization Bearer may be
        used instead.
    ValidateResponseDto:
      required:
      - valid
      type: object
      properties:
        valid:
          type: boolean
          description: True when the token is valid; false on unauthorized responses.
        username:
          type:
          - 'null'
          - string
          description: Username from a valid token; omitted or null when invalid.
      description: Result of validating an access token; returned for both success
        and failure.
tags:
- name: Auth
