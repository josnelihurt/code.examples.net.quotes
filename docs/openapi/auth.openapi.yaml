openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: Authentication service for Aspire Quotes POC
servers:
  - url: /
paths:
  /api/auth/login:
    post:
      operationId: Login
      tags: [Auth]
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
  /api/auth/validate:
    post:
      operationId: ValidateToken
      tags: [Auth]
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '401':
          description: Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, correlationId, expiresIn, username]
      properties:
        accessToken:
          type: string
        correlationId:
          type: string
        expiresIn:
          type: integer
        username:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidateRequest:
      type: object
      properties:
        accessToken:
          type: string
          nullable: true
    ValidateResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        username:
          type: string
          nullable: true
