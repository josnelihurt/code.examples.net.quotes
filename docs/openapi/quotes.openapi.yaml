openapi: 3.1.1
info:
  title: Quotes.Api | v1
  version: 1.0.0
servers:
- url: /
paths:
  /api/quotes/random:
    get:
      tags:
      - Quotes
      operationId: GetRandomQuote
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
components:
  schemas:
    ErrorResponseDto:
      required:
      - error
      type: object
      properties:
        error:
          type: string
          description: Human-readable reason the request was rejected.
      description: Error payload returned when the request is not authorized.
    QuoteResponseDto:
      required:
      - id
      - text
      - author
      type: object
      properties:
        id:
          type: string
          description: Stable quote identifier.
        text:
          type: string
          description: Quote body text.
        author:
          type: string
          description: Attributed author of the quote.
      description: Random quote returned to an authenticated client.
tags:
- name: Quotes
