openapi: 3.1.1
info:
  title: Quotes.Api | v1
  version: 1.0.0
servers:
- url: /
paths:
  /api/v1/quotes/random:
    get:
      tags:
      - Quotes v1
      operationId: GetRandomQuote
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/quotes/{id}:
    get:
      tags:
      - Quotes v1
      operationId: GetQuoteById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/quotes:
    post:
      tags:
      - Quotes v1
      operationId: CreateQuote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequestDto'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
components:
  schemas:
    CreateQuoteRequestDto:
      required:
      - text
      - author
      type: object
      properties:
        text:
          maxLength: 280
          type: string
          description: Quote body text.
        author:
          maxLength: 80
          type: string
          description: Attributed author of the quote.
      description: Payload to add a quote to the in-memory catalog.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    QuoteResponseDto:
      required:
      - id
      - text
      - author
      type: object
      properties:
        id:
          type: string
          description: Stable quote identifier.
        text:
          type: string
          description: Quote body text.
        author:
          type: string
          description: Attributed author of the quote.
      description: Quote returned to an authenticated client.
  securitySchemes:
    Bearer:
      type: http
      description: Enter the bearer token issued by the Auth API.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Quotes v1
