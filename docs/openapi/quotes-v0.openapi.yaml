openapi: 3.1.1
info:
  title: Quotes.Api | v0
  version: 1.0.0
servers:
- url: /
paths:
  /api/v0/quotes/random:
    get:
      tags:
      - Quotes
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v0/quotes:
    get:
      tags:
      - Quotes
      operationId: ListQuotesV0
      parameters:
      - name: page
        in: query
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 1
      - name: pageSize
        in: query
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 20
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotePageResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
      security:
      - Bearer: []
    post:
      tags:
      - Quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequestDto'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v0/quotes/{id}:
    get:
      tags:
      - Quotes
      operationId: GetQuoteByIdV0
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
components:
  schemas:
    CreateQuoteRequestDto:
      required:
      - text
      - author
      type: object
      properties:
        text:
          maxLength: 280
          type: string
          description: Quote body text.
        author:
          maxLength: 80
          type: string
          description: Attributed author of the quote.
      description: Payload to add a quote to the in-memory catalog.
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    QuotePageResponseDto:
      required:
      - items
      - page
      - pageSize
      - totalItems
      - totalPages
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteResponseDto'
          description: Quotes on this page, in stable catalog order.
        page:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: 1-based page number this response represents.
          format: int32
        pageSize:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Number of items per page that was requested.
          format: int32
        totalItems:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Total number of quotes in the catalog.
          format: int32
        totalPages:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Total number of pages at the requested page size.
          format: int32
      description: One page of the quote catalog.
    QuoteResponseDto:
      required:
      - id
      - text
      - author
      type: object
      properties:
        id:
          type: string
          description: Stable quote identifier.
        text:
          type: string
          description: Quote body text.
        author:
          type: string
          description: Attributed author of the quote.
      description: Quote returned to an authenticated client.
  securitySchemes:
    Bearer:
      type: http
      description: Enter the bearer token issued by the Auth API.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Quotes
