<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aspire Quotes — Scalar API Reference</title>
  <style>
    html, body { margin: 0; height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    Scalar.createApiReference('#app', {
      theme: 'purple',
      layout: 'modern',
      sources: [
        {
          title: 'Auth API',
          url: '../openapi/auth.openapi.yaml',
          default: true
        },
        {
          title: 'Quotes API v0 (controllers)',
          url: '../openapi/quotes-v0.openapi.yaml'
        },
        {
          title: 'Quotes API v1 (minimal APIs)',
          url: '../openapi/quotes-v1.openapi.yaml'
        }
      ]
    });
  </script>
</body>
</html>
