openapi: 3.0.3
info:
  title: Quotes API
  version: 1.0.0
  description: Quotes microservice in the Aspire Quotes foundation
servers:
  - url: /
paths:
  /api/quotes/random:
    get:
      operationId: GetRandomQuote
      tags: [Quotes]
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Random quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    QuoteResponse:
      type: object
      description: Random quote returned to an authenticated client.
      required: [id, text, author]
      properties:
        id:
          type: string
          description: Stable quote identifier.
        text:
          type: string
          description: Quote body text.
        author:
          type: string
          description: Attributed author of the quote.
    ErrorResponse:
      type: object
      description: Error payload returned when the request is not authorized.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable reason the request was rejected.
