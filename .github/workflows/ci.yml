name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled re-evaluates the path gates so ci:full-build applied mid-PR retriggers
    # ci with the full matrix (any other label re-runs the filtered set; the
    # concurrency group below cancels the superseded run).
    types: [opened, synchronize, reopened, labeled]

# Superseded runs waste the container-heavy jobs (specs, e2e, contract-drift); cancel
# them for PRs while keeping every push to main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment) so a mutable-tag
# takeover cannot run third-party code against the repository.
jobs:
  # Path gating: every job except this one, secrets-hygiene (a whole-tree grep
  # that costs seconds) and conventions (branch and commit rules describe the
  # PR itself, not the files it touches) runs only when the diff touches the
  # areas it consumes — a
  # docs-only change should not pay for the full matrix. The skip happens at the job
  # level on purpose: skipped check runs still satisfy the branch-protection checks,
  # and the workflow still completes success so merge-me's ci-completion trigger
  # keeps firing. A workflow-level paths filter would break both.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    permissions:
      # paths-filter lists the PR's changed files via the API; the workflow-level
      # contents-only grant would 403 that call and fail every PR run.
      contents: read
      pull-requests: read
    outputs:
      run_build_and_test: ${{ steps.decide.outputs.run_build_and_test }}
      run_lint: ${{ steps.decide.outputs.run_lint }}
      run_codeql: ${{ steps.decide.outputs.run_codeql }}
      run_specs: ${{ steps.decide.outputs.run_specs }}
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
      run_contract_drift: ${{ steps.decide.outputs.run_contract_drift }}
      run_image_pins: ${{ steps.decide.outputs.run_image_pins }}
    steps:
      # Only pull_request diffs are filtered; the API listing needs no checkout. On
      # every other trigger (push to main, ci:full-build) the step is skipped and the
      # decide step below forces the full matrix.
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full-build')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - '*.sln'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - '.config/**'
              - '.editorconfig'
            frontend:
              # The submodule pointer (the gitlink at frontend/). The SPA's own
              # lint/unit/build gates live in code.examples.frontend.quotes's CI; a pointer
              # move here means new SPA code runs against this backend in the
              # full-stack e2e job.
              - 'frontend'
            contracts:
              # Everything that can drift docs/openapi: the APIs that generate the
              # contracts, the hermetic export image with the root build files it
              # COPYs (and the .dockerignore shaping its context), and the frozen
              # files themselves — a package bump can change the generated YAML too.
              - 'src/**'
              - 'docs/openapi/**'
              - 'Dockerfile.build'
              - 'contracts/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - '.dockerignore'
            pins:
              # scripts/images.env is the repo's one copy of the container tags; the
              # pinned Aspire.Hosting packages must agree with it. scripts/e2e.env is
              # the sibling one-copy file for the e2e catalog's connection values — a
              # move in either must reach the jobs that boot containers.
              - 'scripts/images.env'
              - 'scripts/e2e.env'
              - 'Directory.Packages.props'
              - 'scripts/check-image-tags.sh'
            workflow:
              # CI itself or a script it executes: run the unfiltered matrix.
              - '.github/workflows/**'
              - 'scripts/lint.sh'
              - 'scripts/check-image-tags.sh'
              - 'scripts/check-conventions.sh'

      - name: Decide which jobs run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-build') }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_CONTRACTS: ${{ steps.filter.outputs.contracts }}
          FILTER_PINS: ${{ steps.filter.outputs.pins }}
          FILTER_WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          set -euo pipefail
          decisions=""
          out() { decisions+="$1"$'\n'; }
          flush() { printf '%s' "${decisions}" >> "$GITHUB_OUTPUT"; }

          # Pushes to main, ci:full-build PRs and CI-configuration edits have no
          # filtered diff to trust: run everything.
          if [ "${EVENT_NAME:-}" != "pull_request" ] || [ "${FULL_BUILD:-false}" = "true" ] || [ "${FILTER_WORKFLOW:-false}" = "true" ]; then
            out "run_build_and_test=true"
            out "run_lint=true"
            out "run_codeql=true"
            out "run_specs=true"
            out "run_e2e=true"
            out "run_contract_drift=true"
            out "run_image_pins=true"
            flush
            exit 0
          fi

          backend="${FILTER_BACKEND:-false}"
          frontend="${FILTER_FRONTEND:-false}"
          contracts="${FILTER_CONTRACTS:-false}"
          pins="${FILTER_PINS:-false}"

          # specs and e2e boot the pinned container images, so a pin move must reach
          # them even without code changes; e2e additionally builds both APIs and the SPA.
          run_specs="false"
          if [ "${backend}" = "true" ] || [ "${pins}" = "true" ]; then run_specs="true"; fi
          run_e2e="false"
          if [ "${backend}" = "true" ] || [ "${frontend}" = "true" ] || [ "${pins}" = "true" ]; then run_e2e="true"; fi

          # The Postgres-backed tests parse scripts/images.env at runtime, so a pin
          # move must reach build-and-test too, not just the jobs that pull images.
          # The frontend flag now means one thing only: the submodule pointer moved,
          # so the full-stack e2e integration must re-run. The SPA's own gates
          # (lint, unit, mocked e2e, pnpm dependency review) live in
          # code.examples.frontend.quotes's CI on every commit there.
          run_build_and_test="false"
          if [ "${backend}" = "true" ] || [ "${pins}" = "true" ]; then run_build_and_test="true"; fi
          out "run_build_and_test=${run_build_and_test}"
          out "run_lint=${backend}"
          out "run_codeql=${backend}"
          out "run_specs=${run_specs}"
          out "run_e2e=${run_e2e}"
          out "run_contract_drift=${contracts}"
          out "run_image_pins=${pins}"
          flush

  # Branch names, commit subjects and PR titles are rules about the change itself,
  # not about the files it touches — no path gate (same posture as secrets-hygiene).
  # Squash merges make the PR title the canonical commit on main, so the title is
  # held to the commit rule; the (#N) suffix GitHub appends at merge time is the
  # only difference, allowed by the push-side invocation. The same script backs the
  # opt-in local hooks (scripts/setup-git-hooks.sh); the rules live in
  # docs/contributing.md.
  conventions:
    name: conventions (branch names + commit messages)
    runs-on: ubuntu-latest
    permissions:
      # The action reads the PR's commit list from the pulls API.
      contents: read
      pull-requests: read
    steps:
      # fetch-depth 0 because the action's push-to-main range mode reads history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The canonical rules live in the shared toolkit; the exemption covers
      # dependabot's automation branches (their names are not ours to choose).
      - uses: josnelihurt/code.examples.ci/conventions@914ce2f68120ace140da1a445d44e854c97fb168 # v1
        with:
          branch-exempt-regex: '^dependabot/'

  build-and-test:
    name: build & test (Release + coverage)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_build_and_test == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Test projects pull in the whole dependency graph (APIs, ServiceDefaults, both
      # bounded contexts) without the Vite frontend, and Release builds enforce
      # TreatWarningsAsErrors, which never runs in the local Debug flow.
      - name: Test (Release, coverage on)
        run: |
          set -euo pipefail
          find tests -name '*.Tests.csproj' -print0 | xargs -0 -n1 dotnet test -c Release --settings ./tests/coverlet.runsettings

      - name: Upload coverage (OpenCover)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-opencover
          path: tests/**/TestResults/**/*.xml
          if-no-files-found: error

  lint:
    name: lint (dotnet format)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_lint == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The same invocation developers run locally (scripts/lint.sh); per-project,
      # matching scripts/lint.sh (the SPA builds itself in the frontend submodule).
      - name: Format check
        run: ./scripts/lint.sh

  # Ungated on purpose: the grep covers the whole tree (the docs allowlist included)
  # and costs seconds — markdown edits are exactly its business.
  secrets-hygiene:
    name: secrets hygiene (credential literals stay in the allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The seed's scaffolding credentials live in exactly one documentation
      # location (docs/dev-credentials.md), one code location per credential
      # (the implementing class, refused in Production), and the tests that
      # authenticate against them. Everything else fails: a literal that exists
      # only to be copy-pasted is how forks leak.
      - uses: josnelihurt/code.examples.ci/secrets-hygiene@914ce2f68120ace140da1a445d44e854c97fb168 # v1
        with:
          pattern: 'supersecret|readsecret|Dev-Signing-Key|AspireQuotes-Local2!'
          exclude: |
            **/bin/**
            **/obj/**
            .github/workflows/ci.yml
            tests/**
            docs/dev-credentials.md
            src/Auth/Auth.Infrastructure/HardcodedCredentialStore.cs
            src/Auth/Auth.Infrastructure/README.md
            src/ServiceDefaults/JwtAuthExtensions.cs
            src/ServiceDefaults/README.md
          hint: 'Consolidate them into docs/dev-credentials.md (see the allowlist in ci.yml).'

      # The throwaway e2e catalog credentials have exactly one home —
      # scripts/e2e.env — so changing them can never mean editing three files
      # in sync. The sealed world inside Dockerfile.build's export stage and
      # the tests are the only other allowed homes.
      - uses: josnelihurt/code.examples.ci/secrets-hygiene@914ce2f68120ace140da1a445d44e854c97fb168 # v1
        with:
          pattern: 'POSTGRES_PASSWORD=postgres|Password=postgres|PASSWORD .postgres.'
          exclude: |
            **/bin/**
            **/obj/**
            **/pnpm-lock.yaml
            .github/workflows/ci.yml
            scripts/e2e.env
            Dockerfile.build
            tests/**
          hint: 'Consolidate them into scripts/e2e.env (see the allowlist in ci.yml).'

  codeql:
    name: security (CodeQL)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_codeql == 'true'
    permissions:
      # Required by CodeQL to upload the analysis; everything else stays read-only.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          languages: csharp

      # The C# extractor needs a build between init and analyze. Explicit projects
      # (matching scripts/lint.sh); the two APIs pull in ServiceDefaults and both
      # bounded contexts.
      - name: Build for analysis
        run: |
          dotnet restore src/Auth/Auth.Api/Auth.Api.csproj
          dotnet restore src/Quotes/Quotes.Api/Quotes.Api.csproj
          dotnet build src/Auth/Auth.Api/Auth.Api.csproj --no-restore
          dotnet build src/Quotes/Quotes.Api/Quotes.Api.csproj --no-restore

      - uses: github/codeql-action/analyze@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8

  specs:
    name: specs (BDD against the Aspire stack)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_specs == 'true'
    steps:
      # The AppHost model (AddViteApp at ../../frontend) is constructed even though
      # the spec harness removes the web resource before startup — the submodule
      # must be present for the model to resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The gateway resource is a container; pre-pulling keeps the readiness wait honest.
      # Same for the catalog database and its pgweb companion. The references come from
      # scripts/images.env — the repo's one copy of the tags the pinned Aspire.Hosting.*
      # packages run — exported here for every later step in the job.
      - name: Load container image pins
        run: |
          set -a
          . ./scripts/images.env
          set +a
          echo "POSTGRES_IMAGE=${POSTGRES_IMAGE}" >> "$GITHUB_ENV"
          echo "PGWEB_IMAGE=${PGWEB_IMAGE}" >> "$GITHUB_ENV"
          echo "YARP_IMAGE=${YARP_IMAGE}" >> "$GITHUB_ENV"

      - run: |
          docker pull "${YARP_IMAGE}"
          docker pull "${POSTGRES_IMAGE}"
          docker pull "${PGWEB_IMAGE}"

      # No Aspire CLI needed: DistributedApplicationTestingBuilder drives the AppHost
      # in-process via the Aspire.AppHost.Sdk. Slower than build-and-test by design —
      # it proves cross-service journeys, so it runs as its own parallel gate.
      - run: dotnet test tests/Bdd/AspireQuotesPoc.Specs.csproj -c Release --logger "trx;LogFileName=specs.trx"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: specs-results
          path: '**/TestResults/*.trx'

  e2e:
    name: e2e (full-stack Playwright + playwright-bdd)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_e2e == 'true'
    env:
      # Ephemeral per-run key for the two local API processes Playwright boots; the
      # local-development key is documented in docs/dev-credentials.md, never committed.
      E2E_SIGNING_KEY: ci-run-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
    steps:
      # The SPA under test is the frontend submodule; its default e2e is the mocked
      # suite (that repository's CI), this job runs the full-stack config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # playwright.config.ts points its webServer at the Release DLLs.
      - run: |
          dotnet build src/Auth/Auth.Api/Auth.Api.csproj -c Release
          dotnet build src/Quotes/Quotes.Api/Quotes.Api.csproj -c Release

      # The quotes catalog is real in e2e too: throwaway PostgreSQL started from
      # scripts/e2e.env — the one copy of the connection values, the same file
      # scripts/e2e.sh sources locally and playwright.config.ts parses for its webServer
      # env, so the boot paths cannot drift. The API migrates + seeds it at boot, so
      # pg_isready is the only readiness gate needed here. The image comes from the same
      # shared pin file the specs job loads.
      - name: Load container image pins
        run: |
          set -a
          . ./scripts/images.env
          set +a
          echo "POSTGRES_IMAGE=${POSTGRES_IMAGE}" >> "$GITHUB_ENV"

      - name: Start quotes catalog PostgreSQL
        run: |
          set -a
          . ./scripts/e2e.env
          set +a
          docker run -d --name e2e-pg \
            -e POSTGRES_USER="${E2E_PG_USER}" \
            -e POSTGRES_PASSWORD="${E2E_PG_PASSWORD}" \
            -e POSTGRES_DB="${E2E_PG_DATABASE}" \
            -p "127.0.0.1:${E2E_PG_PORT}:5432" \
            "${POSTGRES_IMAGE}"
          for i in $(seq 1 60); do
            docker exec e2e-pg pg_isready -U "${E2E_PG_USER}" -d "${E2E_PG_DATABASE}" && break
            sleep 1
          done

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - run: pnpm run test:e2e:fullstack
        working-directory: frontend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  contract-drift:
    name: openapi contract drift
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_contract_drift == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The frozen contracts under docs/openapi are product: regenerate them hermetically
      # (same flow as scripts/update-contracts.sh) and fail when they no longer match.
      - name: Export contracts
        run: docker build -f Dockerfile.build --target contracts -o type=local,dest=out .

      - name: Fail on drift vs frozen contracts
        run: |
          diff -u docs/openapi/auth.openapi.yaml out/auth.openapi.yaml
          diff -u docs/openapi/quotes-v0.openapi.yaml out/quotes-v0.openapi.yaml
          diff -u docs/openapi/quotes-v1.openapi.yaml out/quotes-v1.openapi.yaml

  image-pins:
    name: container image pin drift
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_image_pins == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The pins in scripts/images.env must be exactly what the pinned Aspire.Hosting.*
      # packages run; a package bump that misses the pin file fails here instead of
      # quietly booting two different Postgres images across CI, e2e and the AppHost.
      - name: Check pins against the Aspire packages
        run: ./scripts/check-image-tags.sh
